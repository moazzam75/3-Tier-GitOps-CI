name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write # needed for commiting to CD repo if using GITHUB_TOKEN

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
    compile:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '23'

            - name: Frontend Compilation (Syntax Check)
              run: |
                cd client
                find . -name "*.js" -exec node --check {} +

            - name: Backend Compilation (Syntax Check)
              run: |
                cd api
                find . -name "*.js" -exec node --check {} +

    gitleaks_scan:
        runs-on: ubuntu-latest
        needs: compile
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Gitleaks Setup
              uses: gitleaks/gitleaks-action@v3

            - name: Gitleaks Scan
              run: |
                gitleaks detect --source ./client --exit-code 1 
                gitleaks detect --source ./api --exit-code 1

    trivy_fs_scan:
        runs-on: ubuntu-latest
        needs: gitleaks_scan
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy vulnerability scanner (FS)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                scan-ref: '.'
                format: 'table'
                ignore-unfixed: true
                vulnerability-type: 'os,library'
                severity: 'CRITICAL,HIGH'
    
    build_backend_docker_image_and_push:
        runs-on: ubuntu-latest
        needs: trivy_fs_scan
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Build and push Docker image (backend)
              uses: docker/build-push-action@v7
              with:
                context: ./api
                file: ./api/Dockerfile
                push: true
                tags: |
                  moazzam75/backend:latest
                  moazzam75/backend:${{ env.IMAGE_TAG }}

    build_frontend_docker_image_and_push:
        runs-on: ubuntu-latest
        needs: trivy_fs_scan
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Build and push Docker image (frontend)
              uses: docker/build-push-action@v7
              with:
                context: ./client
                file: ./client/Dockerfile
                push: true
                tags: |
                  moazzam75/frontend:latest
                  moazzam75/frontend:${{ env.IMAGE_TAG }}

    trivy_image_scan:
        runs-on: ubuntu-latest
        needs: [build_backend_docker_image_and_push, build_frontend_docker_image_and_push]
        steps:
            - name: Checkout (noops, keeps workspace consistent)
              uses: actions/checkout@v4

            - name: Run Trivy image scan (backend)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'image'
                image-ref: 'moazzam75/backend:${{ env.IMAGE_TAG }}'
                format: 'table'
                exit-code: '0' # set to 1 if you want to fail the build on vulnerability detection
                ignore-unfixed: true
                vulnerability-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            - name: Run Trivy image scan (frontend)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'image'
                image-ref: 'moazzam75/frontend:${{ env.IMAGE_TAG }}'
                format: 'table'
                exit-code: '0' # set to 1 if you want to fail the build on vulnerability detection
                ignore-unfixed: true
                vulnerability-type: 'os,library'
                severity: 'CRITICAL,HIGH'

    update_CD_repo:
        runs-on: ubuntu-latest
        needs: trivy_image_scan
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Checkout CD repo
              uses: actions/checkout@v4
              with:
                repository: moazzam75/3-Tier-GitOps-CD
                ref: main
                token: ${{ secrets.CD_REPO_TOKEN }}
                path: cd

            - name: Bump images in manifest (safe)
              working-directory: cd
              env:
                IMAGE_TAG: ${{ env.IMAGE_TAG }}
              run: |
                curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o yq && sudo install yq /usr/local/bin/yq

                # -- Safety cleanup: remove any accidental .spec.template from Service docs
                yq -i '(. | select(.kind=="Service")) |= del(.spec.template)' k8s-prod/backend.yaml
                yq -i '(. | select(.kind=="Service")) |= del(.spec.template)' k8s-prod/frontend.yaml

                # -- Update ONLY Deployment images (backend)
                yq -i '
                    (. | select(.kind=="Deployment")
                    | .spec.template.spec.containers[]
                    | select(.name=="backend")
                    | .image)
                    = "moazzam75/backend:" + strenv(IMAGE_TAG)
                ' k8s-prod/backend.yaml

                # -- Update ONLY Deployment images (frontend)
                yq -i '
                    (. | select(.kind=="Deployment")
                    | .spec.template.spec.containers[]
                    | select(.name=="frontend")
                    | .image)
                    = "moazzam75/frontend:" + strenv(IMAGE_TAG)
                ' k8s-prod/frontend.yaml

            - name: Commit and push changes to CD repo
              working-directory: cd
              run: |
                git config user.name "ci-bot"
                git config user.email "ci-bot@users.noreply.github.com"
                git add -A
                git commit -m "bump images to ${{ env.IMAGE_TAG }}" || echo "No changes"
                git push
